name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Localizar y preparar archivos web en www
        run: |
          mkdir -p www
          # Buscar dónde está index.html dentro del repositorio
          INDEX_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "*/node_modules/*" -not -path "*/www/*" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
            DIR_NAME=$(dirname "$INDEX_PATH")
            echo "Archivos web encontrados en: $DIR_NAME"
            cp -r $DIR_NAME/* www/
          else
            echo "No se encontró index.html, creando un archivo base..."
            echo '<!DOCTYPE html><html><head><title>AcroForm</title></head><body><h1>AcroForm Sealer</h1></body></html>' > www/index.html
          fi

      - name: Instalar Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --yes @capacitor/core @capacitor/cli @capacitor/android

      - name: Crear capacitor.config.json
        run: |
          echo '{"appId":"com.acroform.sealer","appName":"AcroForm Sealer","webDir":"www"}' > capacitor.config.json

      - name: Generar y sincronizar proyecto Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Verificar sincronización correcta
        run: |
          test -f android/app/src/main/assets/capacitor.plugins.json || (echo "Error en la generación de assets" && exit 1)

      - name: Compilar APK en la nube
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: AcroFormSealer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
