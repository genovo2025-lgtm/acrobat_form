name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Mover archivos a la raíz si están en subcarpeta
        run: |
          if [ -d "acrobat_form_sealer" ]; then
            echo "Moviendo contenido de acrobat_form_sealer a la raíz..."
            cp -r acrobat_form_sealer/* .
          fi

      - name: Preparar directorio web (www)
        run: |
          mkdir -p www
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi
          # Copiar todos los archivos estáticos a www excluyendo carpetas del sistema
          rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' . www/ || cp -r index.html js css assets www/ 2>/dev/null || true

      - name: Preparar proyecto e instalar Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Crear capacitor.config.json
        run: |
          echo '{"appId":"com.acroform.sealer","appName":"AcroForm Sealer","webDir":"www"}' > capacitor.config.json

      - name: Generar y sincronizar proyecto Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compilar APK en la nube
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: AcroFormSealer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
